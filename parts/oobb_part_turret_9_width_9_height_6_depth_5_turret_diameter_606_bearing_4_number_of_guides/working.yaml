assembly_steps:
- action: Set out the four guide pairs. Each lower housing has three hex recesses
    on its outside face.
  title: Identify the housings
- action: Press one M6 nut into the side opening of every upper and lower housing.
  title: Load the face-axle nuts
- action: Pass an M6 × 20 hex bolt through each 606 bearing and one washer. Screw
    it into the side nut. Keep the washer against the printed housing.
  title: Fit the face rollers
- action: Press three M6 nuts into the underside of each lower housing. The centre
    nut can slide along its pocket for edge adjustment.
  title: Load the lower housings
- action: Set the frame on the four lower housings with their mounting holes aligned.
    Centre the disc in the opening with its underside on the face rollers.
  title: Seat the frame and disc
- action: At each station, sandwich one 606 edge bearing between two washers. Centre
    the washers over the axle slot and lower the upper housing onto the flat frame
    land.
  title: Stack the edge rollers
- action: Install three M6 × 40 hex bolts from above at each station. The two outer
    bolts join the housings to the frame. Leave the edge-axle bolt loose for adjustment.
  title: Join the guides
- action: Bring each edge roller into light contact. Tighten the edge axles and turn
    the disc through a full revolution. Check that the rollers turn freely and the
    housings sit flat.
  title: Set the running fit
